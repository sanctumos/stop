[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sanctum-stop"
version = "0.1.0"
description = "stop — SanctumOS-top. A btop-shaped, read-only procman TUI for Sanctum agents running in GNU screen."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Decision Science Corp — Otto Vernal" }]
dependencies = [
  "textual>=8.2.8,<9",
  "psutil>=7.0,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5"]

[project.scripts]
stop = "stop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
